name: ci
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - if: runner.os == 'macOS'
        run: swiftc -parse-as-library -typecheck menubar.swift
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $csc = Join-Path $env:SystemRoot 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $demoDir = Join-Path $env:RUNNER_TEMP 'ct-demo'
          $exe = Join-Path $env:RUNNER_TEMP 'ClaudeTransplantCheck.exe'
          & $csc /nologo /warnaserror+ /optimize+ /target:exe "/out:$exe" /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Management.dll /r:System.Web.Extensions.dll /r:System.Windows.Forms.dll tray.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe --demo $demoDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $demoDir 'frame-000.png'))) { throw 'Missing demo frame' }
      - shell: bash
        run: |
          tgz=$(npm pack | tail -n 1)
          npm i -g "./$tgz"
          claude-transplant --version
          claude-transplant --help
  publish:
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: https://registry.npmjs.org }
      - run: test "v$(node -p "require('./package.json').version")" = "${{ github.event.release.tag_name }}"
      - run: npm i -g npm@11 && npm publish
